name: Play release status

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package name"
        required: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install googleapis@144
      - run: node scripts/status.js "${{ github.event.inputs.package }}"
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
