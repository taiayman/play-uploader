name: Upload AAB to Google Play

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package name (applicationId)"
        required: true
      aab:
        description: "Path to AAB inside releases/"
        required: true
      track:
        description: "Track: internal | beta | production"
        required: true
        default: "production"
      whatsnew:
        description: "Path to whatsnew directory (optional)"
        required: false
        default: ""
      notsent:
        description: "true = upload without sending for review (needed after a rejection)"
        required: false
        default: "false"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ github.event.inputs.package }}
          releaseFiles: ${{ github.event.inputs.aab }}
          track: ${{ github.event.inputs.track }}
          status: completed
          whatsNewDirectory: ${{ github.event.inputs.whatsnew }}
          changesNotSentForReview: ${{ github.event.inputs.notsent == 'true' }}

